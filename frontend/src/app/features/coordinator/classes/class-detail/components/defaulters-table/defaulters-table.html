@if (defaulters.length === 0) {
  <p class="empty-state">No outstanding balances in this class.</p>
} @else {
  <table mat-table [dataSource]="defaulters">
    <ng-container matColumnDef="full_name">
      <th mat-header-cell *matHeaderCellDef>Student</th>
      <td mat-cell *matCellDef="let d">{{ d.full_name }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let d">{{ d.phone ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="pending_amount">
      <th mat-header-cell *matHeaderCellDef>Pending Amount</th>
      <td mat-cell *matCellDef="let d">Rs. {{ d.pending_amount | number: '1.0-0' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let d">
        <a mat-button color="primary" [routerLink]="['/coordinator/students', d.student_id, 'fees']">
          View Ledger
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
