<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #sidenav
    class="shell-sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidenavService.isOpen() : true"
    (closedStart)="sidenavService.close()"
  >
    <div class="shell-brand">
      <app-logo [size]="48" [ring]="true" class="brand-mark" />
      <span class="brand-name">Vista Nova</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="is-active" (click)="closeIfMobile()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
