<div class="metrics-grid">
  <app-card class="metric-card">
    <div class="metric-card__inner">
      <div class="metric-icon collected"><mat-icon>payments</mat-icon></div>
      <div class="metric-body">
        <span class="metric-label">Total Collected (This Month)</span>
        <span class="metric-value">Rs. {{ metrics?.total_collected_this_month ?? '0' }}</span>
      </div>
    </div>
  </app-card>

  <app-card class="metric-card" [clickable]="true" appHoverLift (cardClick)="metricClick.emit('pending')">
    <div class="metric-card__inner">
      <div class="metric-icon pending"><mat-icon>schedule</mat-icon></div>
      <div class="metric-body">
        <span class="metric-label">Pending Payments</span>
        <span class="metric-value">{{ metrics?.pending_count ?? 0 }}</span>
      </div>
    </div>
  </app-card>

  <app-card class="metric-card" [clickable]="true" appHoverLift (cardClick)="metricClick.emit('overdue')">
    <div class="metric-card__inner">
      <div class="metric-icon overdue"><mat-icon>warning</mat-icon></div>
      <div class="metric-body">
        <span class="metric-label">Overdue Count</span>
        <span class="metric-value">{{ metrics?.overdue_count ?? 0 }}</span>
      </div>
    </div>
  </app-card>

  <app-card class="metric-card">
    <div class="metric-card__inner">
      <div class="metric-icon active"><mat-icon>groups</mat-icon></div>
      <div class="metric-body">
        <span class="metric-label">Active Students</span>
        <span class="metric-value">{{ metrics?.active_students_count ?? 0 }}</span>
      </div>
    </div>
  </app-card>
</div>
