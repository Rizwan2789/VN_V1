<header class="app-header">
  <div class="brand">
    @if (showBack) {
      <button mat-icon-button class="back-button" type="button" (click)="goBack()" aria-label="Go back">
        <mat-icon>arrow_back</mat-icon>
      </button>
    } @else {
      @if (showMenuToggle) {
        <button
          mat-icon-button
          class="menu-toggle"
          type="button"
          (click)="sidenavService.toggle()"
          aria-label="Toggle navigation menu"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <app-logo [size]="46" [ring]="true" class="brand-mark" />
    }
    <div class="brand-text">
      <span class="brand-name">Vista Nova</span>
      <span class="page-title">{{ title }}</span>
    </div>
  </div>

  <button class="user-menu-trigger" mat-button [matMenuTriggerFor]="menu" type="button">
    <span class="user-avatar">{{ userInitials }}</span>
    <span class="user-info">
      <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
      <span class="user-role">{{ authService.currentUser()?.role }}</span>
    </span>
    <mat-icon class="vn-icon-sm chevron">expand_more</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</header>
