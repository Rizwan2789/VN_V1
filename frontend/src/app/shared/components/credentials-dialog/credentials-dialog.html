<h2 mat-dialog-title>
  <mat-icon class="title-icon">vpn_key</mat-icon>
  {{ data.title }}
</h2>

<mat-dialog-content>
  @if (data.subtitle) {
    <p class="subtitle">{{ data.subtitle }}</p>
  }

  <div class="credential-list">
    @for (field of data.fields; track field.label) {
      <div class="credential-row">
        <span class="credential-label">{{ field.label }}</span>
        <div class="credential-value-row">
          <code class="credential-value">{{ field.value }}</code>
          <button
            mat-icon-button
            type="button"
            [matTooltip]="copiedField() === field.label ? 'Copied!' : 'Copy ' + field.label"
            [attr.aria-label]="'Copy ' + field.label"
            (click)="copyField(field)"
          >
            <mat-icon class="vn-icon-sm">{{ copiedField() === field.label ? 'check' : 'content_copy' }}</mat-icon>
          </button>
        </div>
      </div>
    }
  </div>

  <p class="warning-note">
    <mat-icon class="vn-icon-sm">info</mat-icon>
    <span>This won't be shown again — copy or share it now.</span>
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="copyAll()">
    <mat-icon class="vn-icon-sm">{{ copiedAll() ? 'check' : 'content_copy' }}</mat-icon>
    {{ copiedAll() ? 'Copied' : 'Copy All' }}
  </button>
  <button mat-flat-button color="primary" mat-dialog-close type="button">Done</button>
</mat-dialog-actions>
